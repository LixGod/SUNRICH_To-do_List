<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sunrich Companies — Executive Planner</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/sunrich-logo.png">
  <link rel="apple-touch-icon" href="/icons/icon-180x180.png">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch (e) {}
  </script>
  <script>
    const phoneTheme = matchMedia('(prefers-color-scheme: dark)');
    const manifestIcon = document.createElement('link');
    manifestIcon.rel = 'manifest';
    const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
    function updateInstalledIcons() {
      manifestIcon.href = phoneTheme.matches ? 'manifest-dark.webmanifest' : 'manifest.webmanifest';
      appleIcon.href = phoneTheme.matches ? '/icons/icon-180x180-dark.png' : '/icons/icon-180x180.png';
    }
    function updatePrimeTheme() {
      let choice = 'system';
      try { choice = localStorage.getItem('color-scheme') ?? 'system'; } catch (e) {}
      document.documentElement.classList.toggle('app-dark', choice === 'dark' || (choice === 'system' && phoneTheme.matches));
    }
    updateInstalledIcons();
    updatePrimeTheme();
    document.head.append(manifestIcon);
    phoneTheme.addEventListener('change', () => { updateInstalledIcons(); updatePrimeTheme(); });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
